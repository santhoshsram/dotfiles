global:
  restic-lock-retry-after: 1m

default:
  # Sets the backup destination to a folder on your USB drive
  repository: "local:/Volumes/restic-backup/santhosh-mba"
  password-file: "key.txt"

  # Schedule config: Every 2 hours
  schedule: "*-*-* 00,02,04,06,08,10,12,14,16,18,20,22:00:00"
  schedule-permission: "user"

  # Ensure the compression feature is enabled
  env:
    RESTIC_COMPRESSION: auto

  # Check if the USB drive is mounted before running
  condition: 'mount | grep -q "/Volumes/restic-backup"'

  # Retention policy: Runs automatically after the backup finishes
  retention:
    after-backup: true
    keep-hourly: 12
    keep-daily: 7    # Keep 1 backup per day for the last 7 days
    keep-weekly: 4   # Keep 1 backup per week for the last month
    keep-monthly: 6  # Keep 1 backup per month for the last 6 months
    prune: true      # Actually delete the data chunks freed up by the retention policy

  backup:
    exclude-caches: true
    one-file-system: true
    source:
      - "/Users/santhosh"
    exclude:
      # --- From time machine excludes ---
      - "/Users/santhosh/Music/MyMusic"
      - "/Users/santhosh/Library/Developer/Xcode/DerivedData"
      - "/Users/santhosh/Library/Developer/Xcode/iOS DeviceSupport"
      - "/Users/santhosh/Library/Developer/CoreSimulator"
      - "/Users/santhosh/Library/Application Support/WhatPulse"
      - "/Users/santhosh/Library/Android/sdk/system-images"
      - "/Users/santhosh/Downloads/NO BACKUP"
      - "/Users/santhosh/go"
      - "/Users/santhosh/.gradle"
      - "/Users/santhosh/.gemini"
      - "/Users/santhosh/.antigravity"
      - "/Users/santhosh/.antigravity-ide"
      - "/Users/santhosh/.lmstudio"
      - "/Users/santhosh/.android"
      - "/Users/santhosh/.vscode"

      # --- Your Manual CLI Exclusion ---
      - "/Users/santhosh/Library/Containers/com.docker.docker"

      # --- System and Developer Caches ---
      - "/Users/santhosh/.azure"
      - "/Users/santhosh/.snowflake"
      - "/Users/santhosh/.aws/credentials"
      - "/Users/santhosh/.docker"
      - "/Users/santhosh/.vagrant.d"
      - "/Users/santhosh/.npm"
      - "/Users/santhosh/.nvm"
      - "/Users/santhosh/.m2"
      - "/Users/santhosh/.bundle"
      - "/Users/santhosh/.cocoapods"
      - "/Users/santhosh/.gem"
      - "/Users/santhosh/.pyenv"
      - "/Users/santhosh/.conda"
      - "/Users/santhosh/Library/Caches"
      - "/Users/santhosh/.expo"
      - "/Users/santhosh/.securecoder"
      - "/Users/santhosh/.swiftpm"
      - "/Users/santhosh/.vscode-shared"
      - "/Users/santhosh/.ollama"
      - "/Users/santhosh/.keras"
      - "/Users/santhosh/.kaggle"
      - "/Users/santhosh/.hawtjni"
      - "/Users/santhosh/.continue"
      - "/Users/santhosh/.cursor"
      - "/Users/santhosh/.cline"
      - "/Users/santhosh/.copilot"
      - "/Users/santhosh/.mcp-auth"
      - "/Users/santhosh/.zcompcache"
      - "/Users/santhosh/.zsh_sessions"
      - "/Users/santhosh/.bash_sessions"
      - "/Users/santhosh/.zcompcache"
      - "/Users/santhosh/.Trash"

      # Build artifacts in ~/projects
      - "/Users/santhosh/projects/**/node_modules"
      - "/Users/santhosh/projects/**/.gradle"
      - "/Users/santhosh/projects/**/build"
      - "/Users/santhosh/projects/**/target"
      - "/Users/santhosh/projects/**/bin"
      - "/Users/santhosh/projects/**/dist"
