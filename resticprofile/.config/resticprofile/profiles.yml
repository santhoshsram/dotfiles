global:
  restic-lock-retry-after: 1m

default:
  # Sets the backup destination to a folder on your USB drive
  repository: "local:/Volumes/restic-backup/santhosh-mba"
  password-file: "key.txt"

  # Ensure the compression feature is enabled
  env:
    RESTIC_COMPRESSION: auto

  # Retention policy: runs automatically after the backup finishes
  retention:
    after-backup: true
    keep-hourly: 8
    keep-daily: 7    # Keep 1 backup per day for the last 7 days
    keep-weekly: 4   # Keep 1 backup per week for the last month
    keep-monthly: 6  # Keep 1 backup per month for the last 6 months
    prune: true      # Actually delete the data chunks freed up by the retention policy

  # Same policy, invocable manually via `resticprofile forget`
  forget:
    keep-hourly: 8
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: true

  backup:
    run-before:
      # Aborts the backup if the USB drive isn't mounted (no auto-mount possible for physical media)
      - 'mount | grep -q "/Volumes/restic-backup"'
    schedule: "*-*-* 00,03,06,09,12,15,18,21:00:00"
    schedule-permission: "user_logged_on"
    exclude-caches: true
    one-file-system: true
    source:
      - "/Users/santhosh/Desktop"
      - "/Users/santhosh/Downloads"
      - "/Users/santhosh/Documents"
      - "/Users/santhosh/Library/Mobile Documents/com~apple~CloudDocs"
      - "/Users/santhosh/Music"
      - "/Users/santhosh/Pictures"
      - "/Users/santhosh/projects"
      - "/Users/santhosh/dotfiles"
      - "/Users/santhosh/karabiner-configs"
      - "/Users/santhosh/.config"
      - "/Users/santhosh/.ssh"
      - "/Users/santhosh/.aws/config"
      - "/Users/santhosh/.oci/config"
      - "/Users/santhosh/.local/bin"
      - "/Users/santhosh/.cline"
      - "/Users/santhosh/.claude"
      - "/Users/santhosh/.claude.json"
    exclude:
      - "/Users/santhosh/Downloads/NO BACKUP"

      # Secrets
      - "/Users/santhosh/dotfiles/resticprofile/.config/resticprofile/key.txt"
      - "/Users/santhosh/dotfiles/resticprofile/.config/resticprofile/b2.env"

      # Inside projects — build artifacts
      - "/Users/santhosh/projects/**/node_modules"
      - "/Users/santhosh/projects/**/.gradle"
      - "/Users/santhosh/projects/**/build"
      - "/Users/santhosh/projects/**/target"
      - "/Users/santhosh/projects/**/bin"
      - "/Users/santhosh/projects/**/dist"
      - "/Users/santhosh/projects/**/.expo"
      - "/Users/santhosh/projects/**/.terraform"
      - "/Users/santhosh/projects/**/packer_cache"
      - "/Users/santhosh/projects/**/Pods"

      # Inside .config — app caches
      - "/Users/santhosh/.config/**/Cache"
      - "/Users/santhosh/.config/**/cache"
      - "/Users/santhosh/.config/**/CachedData"

      # Inside projects — per-task git worktrees
      - "/Users/santhosh/projects/**/.claude/worktrees"
      - "/Users/santhosh/projects/**/.agent/worktrees"

b2:
  inherit: default
  repository: "b2:santhosh-mba-restic-test"
  env-file: "/Users/santhosh/dotfiles/resticprofile/.config/resticprofile/b2.env"
  backup:
    schedule: "*-*-* 00,03,06,09,12,15,18,21:00:00"
    schedule-permission: "user_logged_on"
  retention:
    after-backup: true
    keep-hourly: 4
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: true
  forget:
    keep-hourly: 4
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: true

blackhole:
  inherit: default
  repository: "local:/Volumes/santhosh-restic/santhosh-mba"
  backup:
    run-before:
      - "/Users/santhosh/dotfiles/resticprofile/.config/resticprofile/mount-smb.sh"
    schedule: "*-*-* 00,03,06,09,12,15,18,21:00:00"
    schedule-permission: "user_logged_on"
  retention:
    after-backup: true
    keep-hourly: 4
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: true
  forget:
    keep-hourly: 4
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 6
    prune: true
